# Конфигурация ruff для backend. Проверка:  python -m ruff check .

line-length = 120
target-version = "py311"
# Файлы миграций генерирует Alembic — их форматирование на совести Alembic.
extend-exclude = ["alembic/versions"]

[lint]
select = ["E", "F", "W", "B", "UP", "I", "RUF"]
ignore = [
    # Depends(...) в значениях по умолчанию аргументов — не «вызов функции в дефолте»,
    # а единственный идиоматичный способ подключения внедрения зависимостей в FastAPI.
    "B008",
    # Перенос длинных строк в описаниях эндпоинтов хуже, чем широкая строка.
    "E501",
    # RUF001-003 ищут латинские гомоглифы среди кириллических символов. Проект по-русски
    # пишет комментарии, строки ответов и тестовые данные намеренно — правила глушили бы
    # нормальный код, а не ловили подмену.
    "RUF001",
    "RUF002",
    "RUF003",
]

[lint.per-file-ignores]
# Подмена DATABASE_URL и секретов должна произойти ДО импорта приложения.
"tests/conftest.py" = ["E402"]
# В env.py Alembic путь поиска добавляется перед импортом моделей — это осознанно.
"alembic/env.py" = ["E402"]
